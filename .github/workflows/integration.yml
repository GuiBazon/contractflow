name: Integração Web e Mobile
on:
  push:
    branches:
      - integration/final-sprint2-20261112
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'api/**'
      - '.github/workflows/integration.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'api/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo config --type public --json > /tmp/contractflow-expo-config.json
      - run: npx expo export --platform android --output-dir dist-ci
