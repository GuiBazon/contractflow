[pytest]
# O pypdfium2 (usado para rasterizar PDFs escaneados) inicializa a biblioteca
# nativa PDFium via FPDF_InitLibraryWithConfig, que usa tratamento de excecoes
# estruturadas (SEH) no Windows. O faulthandler do pytest interpreta esse
# mecanismo interno como "access violation" e imprime um traceback assustador,
# embora a biblioteca funcione normalmente. Desabilitamos apenas esse plugin
# para manter a saida dos testes limpa e sem falsos positivos.
addopts = -p no:faulthandler
testpaths = tests
